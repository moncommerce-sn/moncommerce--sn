<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Mon Commerce</title>
<meta name="theme-color" content="#14503B">

<style>
:root{
 --bg:#F1F5F2;
 --card:#FFFFFF;
 --ink:#14261E;
 --mute:#5F7168;
 --line:#D8E1DB;
 --main:#14503B;
 --onmain:#FFFFFF;
 --acc:#E8A317;
 --onacc:#1C1400;
 --bad:#B4462B;
 --ok:#1E7A4F;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--ink);
 font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding-bottom:85px;
}

header{
 padding:18px 16px 8px;
 max-width:600px;
 margin:auto;
}

header h1{margin:0;font-size:24px}
header p{margin:3px 0;color:var(--mute);font-size:14px}

main{
 padding:8px 16px;
 max-width:600px;
 margin:auto;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:15px;
 padding:14px;
 margin-bottom:12px;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.big{
 font-size:22px;
 font-weight:700;
}

.lbl{
 color:var(--mute);
 font-size:13px;
}

label{
 display:block;
 font-size:13px;
 color:var(--mute);
 margin:10px 0 4px;
}

input,select,textarea{
 width:100%;
 font:inherit;
 padding:12px;
 border:1px solid var(--line);
 border-radius:10px;
 background:var(--bg);
 color:var(--ink);
 min-height:48px;
}

button{
 font:inherit;
 font-weight:600;
 border:0;
 border-radius:12px;
 min-height:50px;
 padding:0 16px;
 background:var(--main);
 color:var(--onmain);
 width:100%;
 margin-top:12px;
}

button.sm{
 width:auto;
 min-height:40px;
 margin:0;
 padding:0 11px;
 font-size:13px;
}

button.alt{
 background:transparent;
 color:var(--main);
 border:1px solid var(--main);
}

button.acc{
 background:var(--acc);
 color:var(--onacc);
}

button.danger{
 background:var(--bad);
 color:white;
}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:11px 0;
 border-top:1px solid var(--line);
}

.row:first-child{border-top:0}

.low{
 color:var(--bad);
 font-weight:700;
}

.ok{color:var(--ok)}
.debt{color:var(--bad);font-weight:700}

.pay{
 display:flex;
 gap:6px;
 align-items:center;
}

.pay input{width:105px}

nav{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 display:flex;
 background:var(--card);
 border-top:1px solid var(--line);
 z-index:20;
}

nav button{
 flex:1;
 margin:0;
 border-radius:0;
 background:transparent;
 color:var(--mute);
 min-height:62px;
 font-size:12px;
 padding:0 3px;
}

nav button[aria-selected="true"]{
 color:var(--main);
 box-shadow:inset 0 3px 0 var(--main);
}

.empty{
 color:var(--mute);
 text-align:center;
 padding:16px 0;
}

.msg{
 background:var(--acc);
 color:var(--onacc);
 padding:10px 12px;
 border-radius:10px;
 margin-bottom:12px;
 font-weight:600;
}

.badge{
 display:inline-block;
 padding:3px 7px;
 border-radius:8px;
 background:var(--bg);
 font-size:12px;
 color:var(--mute);
}

.hidden{display:none!important}

.product-result{
 padding:12px;
 border:1px solid var(--line);
 border-radius:10px;
 margin-top:7px;
 cursor:pointer;
 background:var(--card);
}

.product-result:active{
 background:var(--bg);
}

.stat{
 text-align:center;
}

.stat .big{
 margin-top:4px;
}

hr{
 border:0;
 border-top:1px solid var(--line);
 margin:14px 0;
}

textarea{
 resize:vertical;
 min-height:100px;
}

.scanner-box{
 position:fixed;
 inset:0;
 background:#000;
 z-index:100;
 display:flex;
 flex-direction:column;
}

.scanner-box video{
 width:100%;
 flex:1;
 object-fit:cover;
}

.scanner-top{
 color:white;
 padding:15px;
 text-align:center;
}

.scanner-bottom{
 padding:12px;
 background:#000;
}

.scanner-bottom button{
 margin:0;
}

@media(max-width:430px){
 .grid{grid-template-columns:1fr 1fr}
 .row{align-items:flex-start}
}
</style>
</head>

<body>

<header>
 <h1>Mon commerce</h1>
 <p>Stock, ventes, bénéfices, dettes et dépenses</p>
</header>

<main id="app"></main>

<nav id="nav"></nav>

<script>

/* =========================================================
   DONNÉES
========================================================= */

var TABS=[
 ["res","Résumé"],
 ["vente","Vente"],
 ["stock","Stock"],
 ["dette","Dettes"],
 ["hist","Historique"]
];

var S={
 products:[],
 sales:[],
 debts:[],
 expenses:[]
};

var tab="res";
var msg="";
var cart=[];
var selectedProduct=null;
var editingIndex=null;

/* =========================================================
   SAUVEGARDE / MIGRATION
========================================================= */

function load(){

 try{

  var old=localStorage.getItem("mc1");

  if(old){

   var data=JSON.parse(old);

   /*
    Compatibilité avec l'ancienne version :
    prods -> products
    sales -> sales
    debts objet -> tableau
   */

   if(data.products){
    S=data;
   }else{

    S.products=(data.prods||[]).map(function(p){
     return {
      name:p.n||"",
      barcode:p.b||"",
      purchasePrice:Number(p.pa)||0,
      defaultSalePrice:Number(p.pv)||0,
      stock:Number(p.q)||0,
      category:"",
      unit:"pièce"
     };
    });

    S.sales=(data.sales||[]).map(function(s){
     return {
      date:s.t||Date.now(),
      product:s.n||"",
      quantity:Number(s.q)||0,
      purchasePrice:Number(s.pa)||0,
      salePrice:Number(s.pv)||0,
      payment:s.m||"Espèces",
      customer:s.c||"",
      paid:Number(s.paid)||0,
      remaining:Number(s.remaining)||0
     };
    });

    S.debts=[];

    if(data.debts){
     Object.keys(data.debts).forEach(function(name){
      S.debts.push({
       customer:name,
       amount:Number(data.debts[name])||0
      });
     });
    }

    S.expenses=[];
   }
  }

 }catch(e){

  S={
   products:[],
   sales:[],
   debts:[],
   expenses:[]
  };

 }

 normalizeData();
}

function normalizeData(){

 if(!Array.isArray(S.products))S.products=[];
 if(!Array.isArray(S.sales))S.sales=[];
 if(!Array.isArray(S.debts))S.debts=[];
 if(!Array.isArray(S.expenses))S.expenses=[];

 S.products=S.products.map(function(p){
  return {
   name:p.name||p.n||"",
   barcode:p.barcode||p.b||"",
   purchasePrice:Number(p.purchasePrice??p.pa)||0,
   defaultSalePrice:Number(p.defaultSalePrice??p.pv)||0,
   stock:Number(p.stock??p.q)||0,
   category:p.category||"",
   unit:p.unit||"pièce"
  };
 });

 S.sales=S.sales.map(function(s){
  var price=Number(s.salePrice??s.pv)||0;

  return {
   date:Number(s.date??s.t)||Date.now(),
   product:s.product||s.n||"",
   quantity:Number(s.quantity??s.q)||0,
   purchasePrice:Number(s.purchasePrice??s.pa)||0,
   salePrice:price,
   payment:s.payment||s.m||"Espèces",
   customer:s.customer||s.c||"",
   paid:Number(s.paid)||0,
   remaining:Number(s.remaining)||0
  };
 });

 save();
}

function save(){

 try{
  localStorage.setItem("mc1",JSON.stringify(S));
 }catch(e){
  alert("Impossible de sauvegarder les données.");
 }
}

/* =========================================================
   OUTILS
========================================================= */

function money(n){
 return Math.round(Number(n)||0).toLocaleString("fr-FR")+" FCFA";
}

function esc(s){

 return String(s??"").replace(/[&<>"]/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;"
  }[c];
 });
}

function dateTime(t){

 return new Date(t).toLocaleString("fr-FR",{
  day:"2-digit",
  month:"2-digit",
  year:"numeric",
  hour:"2-digit",
  minute:"2-digit"
 });
}

function dateOnly(t){

 return new Date(t).toLocaleDateString("fr-FR",{
  day:"2-digit",
  month:"2-digit",
  year:"numeric"
 });
}

function todayKey(t){

 var d=new Date(t);

 return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function today(){

 return todayKey(Date.now());
}

function thisMonth(t){

 var d=new Date(t);
 var n=new Date();

 return d.getFullYear()==n.getFullYear() &&
        d.getMonth()==n.getMonth();
}

function val(id){

 var e=document.getElementById(id);
 return e?e.value:"";
}

function say(m){

 msg=m;
 draw();
}

function go(t){

 tab=t;
 msg="";
 draw();
}

function nav(){

 document.getElementById("nav").innerHTML=
 TABS.map(function(t){

  return '<button role="tab" aria-selected="'+(t[0]==tab)+'" onclick="go(\''+
  t[0]+'\')">'+t[1]+'</button>';

 }).join("");
}

/* =========================================================
   PRODUITS
========================================================= */

function addProduct(){

 var name=val("pn").trim();
 var barcode=val("pb").trim();
 var purchase=Number(val("pa"))||0;
 var sale=Number(val("pv"))||0;
 var stock=Number(val("pq"))||0;
 var category=val("pc").trim();
 var unit=val("pu")||"pièce";

 if(!name){
  return say("Écris le nom du produit.");
 }

 if(purchase<0 || sale<0 || stock<0){
  return say("Les valeurs doivent être positives.");
 }

 if(editingIndex!==null){

  S.products[editingIndex]={
   name:name,
   barcode:barcode,
   purchasePrice:purchase,
   defaultSalePrice:sale,
   stock:stock,
   category:category,
   unit:unit
  };

  editingIndex=null;
  save();

  return say("Produit modifié : "+name);
 }

 S.products.push({
  name:name,
  barcode:barcode,
  purchasePrice:purchase,
  defaultSalePrice:sale,
  stock:stock,
  category:category,
  unit:unit
 });

 save();

 say("Produit ajouté : "+name);
}

function editProduct(i){

 var p=S.products[i];

 editingIndex=i;
 tab="stock";
 msg="";

 draw();

 setTimeout(function(){

  document.getElementById("pn").value=p.name;
  document.getElementById("pb").value=p.barcode;
  document.getElementById("pa").value=p.purchasePrice;
  document.getElementById("pv").value=p.defaultSalePrice;
  document.getElementById("pq").value=p.stock;
  document.getElementById("pc").value=p.category;
  document.getElementById("pu").value=p.unit;

  window.scrollTo(0,0);

 },50);
}

function cancelEdit(){

 editingIndex=null;
 draw();
}

function deleteProduct(i){

 if(!confirm("Supprimer ce produit ?"))return;

 S.products.splice(i,1);

 save();

 say("Produit supprimé.");
}

function addStock(i){

 var q=Number(val("stock_"+i));

 if(!q || q<=0){
  return say("Entre une quantité à ajouter.");
 }

 S.products[i].stock+=q;

 save();

 say("Stock ajouté.");
}

function bulkAdd(){

 var text=val("bulk").trim();

 if(!text){
  return say("Ajoute au moins une ligne.");
 }

 var lines=text.split("\n");
 var added=0;

 lines.forEach(function(line){

  var a=line.split(/[,;\t]/).map(function(x){
   return x.trim();
  });

  if(!a[0])return;

  var p={
   name:a[0],
   purchasePrice:Number(a[1])||0,
   defaultSalePrice:Number(a[2])||0,
   stock:Number(a[3])||0,
   barcode:a[4]||"",
   category:a[5]||"",
   unit:a[6]||"pièce"
  };

  S.products.push(p);
  added++;
 });

 save();

 say(added+" produit(s) ajouté(s).");
}

/* =========================================================
   RECHERCHE PRODUIT
========================================================= */

function productSearch(){

 var q=val("saleSearch").trim().toLowerCase();
 var box=document.getElementById("searchResults");

 if(!box)return;

 if(!q){

  box.innerHTML="";
  return;
 }

 var results=S.products.filter(function(p){

  return p.name.toLowerCase().includes(q) ||
         (p.barcode||"").includes(q);
 });

 if(!results.length){

  box.innerHTML='<div class="empty">Aucun produit trouvé.</div>';
  return;
 }

 box.innerHTML=results.map(function(p){

  var i=S.products.indexOf(p);

  return `
   <div class="product-result" onclick="chooseProduct(${i})">
    <b>${esc(p.name)}</b><br>
    <span class="lbl">
     Stock : ${p.stock} ${esc(p.unit)}
     ${p.barcode?" · "+esc(p.barcode):""}
    </span>
   </div>
  `;

 }).join("");
}

function chooseProduct(i){

 selectedProduct=i;

 var p=S.products[i];

 document.getElementById("selectedProduct").innerHTML=`
  <div class="card" style="margin-top:10px">
   <b>${esc(p.name)}</b>
   <div class="lbl">
    Stock disponible : ${p.stock} ${esc(p.unit)}
   </div>
   <label>Quantité</label>
   <input id="saleQty" type="number" min="1" value="1">

   <label>Prix de vente réel pour cette vente</label>
   <input id="salePrice" type="number" inputmode="numeric"
          value="${p.defaultSalePrice}"
          placeholder="Ex : 20000">

   <button class="acc" onclick="addSelectedToCart()">
    Ajouter au panier
   </button>
  </div>
 `;

 document.getElementById("searchResults").innerHTML="";
 document.getElementById("saleSearch").value="";

}

/* =========================================================
   SCANNER
========================================================= */

function openScanner(){

 var box=document.createElement("div");

 box.className="scanner-box";
 box.id="scannerBox";

 box.innerHTML=`
  <div class="scanner-top">
   <b>Scanner le code-barres</b>
   <div style="font-size:13px">
    Place le code-barres devant la caméra
   </div>
  </div>

  <video id="scannerVideo" autoplay playsinline></video>

  <div class="scanner-bottom">
   <button class="danger" onclick="closeScanner()">Fermer</button>
  </div>
 `;

 document.body.appendChild(box);

 startCameraScanner();
}

var scannerStream=null;
var scannerTimer=null;

async function startCameraScanner(){

 try{

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

   closeScanner();

   return say("La caméra n'est pas disponible sur cet appareil.");
  }

  scannerStream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:"environment"}
   },
   audio:false
  });

  var video=document.getElementById("scannerVideo");

  video.srcObject=scannerStream;

  await video.play();

  /*
   BarcodeDetector est utilisé quand le navigateur le supporte.
   Si le navigateur ne le supporte pas
