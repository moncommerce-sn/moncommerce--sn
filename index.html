<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon commerce</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14503B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F1F5F2;--card:#FFFFFF;--ink:#14261E;--mute:#5F7168;--line:#D8E1DB;--main:#14503B;--onmain:#FFFFFF;--acc:#E8A317;--onacc:#1C1400;--bad:#B4462B;--ok:#1E7A4F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A15;--card:#16261F;--ink:#E8F0EB;--mute:#93A89C;--line:#2A3D34;--main:#2E9B72;--onmain:#06130D;--acc:#F0B429;--bad:#E27B5F;--ok:#4FC28C}}
:root[data-theme="dark"]{--bg:#0E1A15;--card:#16261F;--ink:#E8F0EB;--mute:#93A89C;--line:#2A3D34;--main:#2E9B72;--onmain:#06130D;--acc:#F0B429;--bad:#E27B5F;--ok:#4FC28C}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{padding:16px 16px 8px}header h1{margin:0;font-size:22px}header p{margin:2px 0 0;color:var(--mute);font-size:14px}
main{padding:8px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:22px;font-weight:700}.lbl{color:var(--mute);font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:50px;padding:0 16px;background:var(--main);color:var(--onmain);width:100%;margin-top:12px}
button.sm{width:auto;min-height:40px;margin:0;padding:0 12px;font-size:14px}
button.alt{background:transparent;color:var(--main);border:1px solid var(--main)}
button.acc{background:var(--acc);color:var(--onacc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row b{display:block}
.low{color:var(--bad);font-weight:600}.debt{color:var(--bad)}.ok{color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;margin:0;border-radius:0;background:transparent;color:var(--mute);min-height:60px;font-size:13px}
nav button[aria-selected="true"]{color:var(--main);box-shadow:inset 0 3px 0 var(--main)}
.empty{color:var(--mute);text-align:center;padding:14px 0}
.msg{background:var(--acc);color:var(--onacc);padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600}
.pay{display:flex;gap:8px;align-items:center}.pay input{width:110px}
textarea{resize:vertical;min-height:110px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Mon commerce</h1><p>Stock, ventes, marge et dettes de ta boutique</p></header>
<main id="app"></main>
<nav id="nav" role="tablist"></nav>
<script>
var TABS=[["res","Résumé"],["vente","Vente"],["stock","Stock"],["dette","Dettes"],["hist","Historique"]];
var S={prods:[],sales:[],debts:{}},tab="res",msg="";
function load(){try{var r=localStorage.getItem("mc1");if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem("mc1",JSON.stringify(S))}catch(e){}}
function f(n){return Math.round(n).toLocaleString("fr-FR")+" FCFA"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function day(t){var d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function go(t){tab=t;msg="";draw()}
function say(m){msg=m;draw()}
function nav(){document.getElementById("nav").innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(t[0]==tab)+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")}
function val(id){return document.getElementById(id).value}
function addProd(){var n=val("pn").trim(),pa=+val("pa"),pv=+val("pv"),q=+val("pq");
 if(!n||!pv){return say("Écris le nom et le prix de vente.")}
 S.prods.push({n:n,pa:pa||0,pv:pv,q:q||0,b:val("pb").trim()});save();say("Produit ajouté : "+n)}
function bulkAdd(){var L=val("bl").split("\n"),n=0,bad=0;
 L.forEach(function(x){x=x.trim();if(!x)return;var a=x.split(/[,;\t]/).map(function(s){return s.trim()});
  var pv=parseFloat((a[2]||"").replace(/\s/g,"")),pa=parseFloat((a[1]||"").replace(/\s/g,"")),q=parseFloat((a[3]||"").replace(/\s/g,""));
  if(!a[0]||isNaN(pv)){bad++;return}
  S.prods.push({n:a[0],pa:isNaN(pa)?0:pa,pv:pv,q:isNaN(q)?0:q,b:a[4]||""});n++});
 if(n)save();say(n+" produit(s) ajouté(s)"+(bad?". "+bad+" ligne(s) ignorée(s) : vérifie le format.":"."))}
function filt(){var v=val("sf").toLowerCase();document.querySelectorAll("[data-n]").forEach(function(r){r.hidden=r.dataset.n.indexOf(v)<0})}
function scan(cb){var ok=("BarcodeDetector" in window)&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
 if(!ok)return say("Scanner caméra non disponible ici. Ouvre l'app dans Chrome, ou tape le code à la main.");
 var o=document.createElement("div");o.style.cssText="position:fixed;inset:0;z-index:9;background:#000;display:flex;flex-direction:column";
 o.innerHTML='<video playsinline muted style="flex:1;width:100%;object-fit:cover"></video><button style="border-radius:0;margin:0;min-height:64px" class="acc">Fermer</button>';
 document.body.appendChild(o);var v=o.querySelector("video"),st=null,stop=false;
 function end(){stop=true;if(st)st.getTracks().forEach(function(x){x.stop()});o.remove()}
 o.querySelector("button").onclick=end;
 navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){st=s;v.srcObject=s;v.play();
  var d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
  (function loop(){if(stop)return;d.detect(v).then(function(r){if(r.length){var c=r[0].rawValue;end();cb(c)}else setTimeout(loop,250)}).catch(function(){setTimeout(loop,400)})})()
 }).catch(function(){end();say("Caméra refusée. Autorise la caméra ou tape le code.")})}
function scanProd(){scan(function(c){var e=document.getElementById("pb");if(e)e.value=c})}
function scanSell(){scan(codeSell)}
function kd(e){if(e.key=="Enter")codeSell(e.target.value)}
function codeSell(c){c=String(c).trim();if(!c)return;var i=S.prods.findIndex(function(p){return p.b==c});
 if(i<0)return say("Code "+c+" inconnu. Ajoute ce produit dans Stock.");
 if(1+inCart(i)>S.prods[i].q)return say("Stock insuffisant pour "+S.prods[i].n+".");
 var l=C.filter(function(x){return x.i==i})[0];if(l)l.q++;else C.push({i:i,q:1});say("Ajouté : "+S.prods[i].n)}
function restock(i){var q=+val("rq"+i);if(!q)return;S.prods[i].q+=q;save();say("Stock mis à jour.")}
function delProd(i){S.prods.splice(i,1);save();draw()}
var C=[];
function inCart(i){return C.filter(function(l){return l.i==i}).reduce(function(s,l){return s+l.q},0)}
function addCart(){var i=val("sp");if(i==="")return say("Ajoute d'abord un produit dans Stock.");
 var p=S.prods[i],q=+val("sq")||1;
 if(q+inCart(i)>p.q)return say("Stock insuffisant : il reste "+p.q+" "+p.n+".");
 var l=C.filter(function(x){return x.i==i})[0];if(l)l.q+=q;else C.push({i:+i,q:q});say("")}
function rmCart(k){C.splice(k,1);say("")}
function sell(){if(!C.length)return say("Ajoute au moins un produit à la vente.");
 var m=val("sm"),c=val("sc").trim(),tot=0;
 if(m=="Crédit"&&!c)return say("Écris le nom du client pour une vente à crédit.");
 var now=Date.now();
 C.forEach(function(l){var p=S.prods[l.i];p.q-=l.q;tot+=p.pv*l.q;S.sales.push({t:now,n:p.n,q:l.q,pv:p.pv,pa:p.pa,m:m,c:c})});
 if(m=="Crédit")S.debts[c]=(S.debts[c]||0)+tot;
 C=[];save();say("Vente enregistrée : "+f(tot))}
function pay(c){var v=val("d_"+c.replace(/\W/g,"_")),a=v?+v:S.debts[c];a=Math.min(a,S.debts[c]);if(!a)return;
 S.debts[c]-=a;if(S.debts[c]<=0)delete S.debts[c];save();say("Paiement de "+f(a)+" reçu.")}
function relance(c){var t="Bonjour "+c+", petit rappel : tu me dois "+f(S.debts[c])+". Merci !";
 window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}
function reset(){if(document.getElementById("rst").dataset.ok=="1"){S={prods:[],sales:[],debts:{}};save();say("Données effacées.")}
 else{var b=document.getElementById("rst");b.dataset.ok="1";b.textContent="Appuie encore pour tout effacer"}}
var HP="7";
function dlab(t){return new Date(t).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function hlab(t){return new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function hdata(){var d0=new Date();d0.setHours(0,0,0,0);var lim=HP=="all"?0:d0.getTime()-(+HP-1)*864e5,days={},order=[],ca=0,mg=0,n=0;
 S.sales.forEach(function(s){if(s.t<lim)return;var k=day(s.t);if(!days[k]){days[k]={t:s.t,ca:0,mg:0,l:[]};order.push(k)}
  var d=days[k],a=s.pv*s.q,b=(s.pv-s.pa)*s.q;d.ca+=a;d.mg+=b;d.l.push(s);ca+=a;mg+=b;n++});
 order.sort(function(a,b){return days[b].t-days[a].t});return{days:days,order:order,ca:ca,mg:mg,n:n}}
function hwa(){var r=hdata(),lab={"1":"aujourd'hui","7":"7 derniers jours","30":"30 derniers jours","all":"depuis le début"}[HP];
 var t="Mon commerce - Rapport ("+lab+")\nVentes : "+f(r.ca)+"\nBénéfice : "+f(r.mg)+"\nNombre d'articles vendus : "+r.n+"\n";
 r.order.forEach(function(k){t+="\n"+dlab(r.days[k].t)+" : "+f(r.days[k].ca)+" (bénéfice "+f(r.days[k].mg)+")"});
 window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}
function draw(){nav();var h=msg?'<div class="msg" role="status">'+esc(msg)+'</div>':"";
 if(tab=="res"){var td=S.sales.filter(function(s){return day(s.t)==today()}),ca=0,mg=0;
  td.forEach(function(s){ca+=s.pv*s.q;mg+=(s.pv-s.pa)*s.q});
  var dt=0,k;for(k in S.debts)dt+=S.debts[k];
  var low=S.prods.filter(function(p){return p.q<=5});
  h+='<div class="grid"><div class="card"><div class="lbl">Ventes du jour</div><div class="big">'+f(ca)+'</div></div>'+
   '<div class="card"><div class="lbl">Bénéfice du jour</div><div class="big ok">'+f(mg)+'</div></div></div>'+
   '<div class="card"><div class="lbl">Dettes à récupérer</div><div class="big debt">'+f(dt)+'</div></div>'+
   '<div class="card"><b>À racheter (5 ou moins en stock)</b>'+(low.length?low.map(function(p){return '<div class="row"><span>'+esc(p.n)+'</span><span class="low">'+p.q+'</span></div>'}).join(""):'<div class="empty">Rien à racheter pour le moment.</div>')+'</div>'+
   '<div class="card"><b>Dernières ventes</b>'+(S.sales.length?S.sales.slice(-5).reverse().map(function(s){return '<div class="row"><span>'+s.q+" × "+esc(s.n)+'<br><span class="lbl">'+esc(s.m)+(s.c?" · "+esc(s.c):"")+'</span></span><b>'+f(s.pv*s.q)+'</b></div>'}).join(""):'<div class="empty">Aucune vente. Va dans Vente pour commencer.</div>')+'</div>'+
   '<button class="alt" id="rst" onclick="reset()">Effacer toutes les données</button>';
 }
 if(tab=="vente"){var tot=0;
  var lines=C.map(function(l,k){var p=S.prods[l.i];tot+=p.pv*l.q;return '<div class="row"><div><b>'+l.q+" × "+esc(p.n)+'</b><span class="lbl">'+f(p.pv)+' l\'unité</span></div><div class="pay"><b>'+f(p.pv*l.q)+'</b><button class="sm alt" onclick="rmCart('+k+')" aria-label="Retirer">X</button></div></div>'}).join("");
  h+='<div class="card"><b>1. Ajouter les produits vendus</b><button class="acc" onclick="scanSell()">Scanner un produit</button><label for="sb">Ou scanne / tape le code puis Entrée (lecteur USB ou Bluetooth)</label><input id="sb" inputmode="numeric" onkeydown="kd(event)"><label for="sp">Produit</label><select id="sp">'+(S.prods.length?S.prods.map(function(p,i){return '<option value="'+i+'">'+esc(p.n)+" — "+f(p.pv)+" (stock "+p.q+")</option>"}).join(""):'<option value="">Aucun produit</option>')+'</select>'+
  '<label for="sq">Quantité</label><input id="sq" type="number" inputmode="numeric" min="1" value="1">'+
  '<button class="alt" onclick="addCart()">Ajouter à la vente</button></div>'+
  '<div class="card"><b>2. Panier du client</b>'+(C.length?lines+'<div class="row"><b>Total</b><b class="big">'+f(tot)+'</b></div>':'<div class="empty">Panier vide. Ajoute autant de produits que le client achète.</div>')+
  '<label for="sm">Paiement</label><select id="sm"><option>Espèces</option><option>Wave</option><option>Orange Money</option><option>Crédit</option></select>'+
  '<label for="sc">Nom du client (obligatoire pour le crédit)</label><input id="sc" placeholder="Ex : Fatou">'+
  '<button class="acc" onclick="sell()">Valider la vente</button></div>'}
 if(tab=="stock"){h+='<div class="card"><b>Ajouter un produit</b><label for="pn">Nom</label><input id="pn" placeholder="Ex : Sucre 1 kg">'+
  '<label for="pb">Code-barres (facultatif)</label><div class="pay"><input id="pb" inputmode="numeric" style="width:100%"><button class="sm acc" style="min-height:48px" onclick="scanProd()">Scanner</button></div>'+
  '<div class="grid"><div><label for="pa">Prix d\'achat</label><input id="pa" type="number" inputmode="numeric"></div><div><label for="pv">Prix de vente</label><input id="pv" type="number" inputmode="numeric"></div></div>'+
  '<label for="pq">Quantité en stock</label><input id="pq" type="number" inputmode="numeric"><button onclick="addProd()">Ajouter le produit</button></div>'+
  '<div class="card"><b>Ajouter plusieurs produits d\'un coup</b><p class="lbl">Un produit par ligne : nom, prix d\'achat, prix de vente, quantité, code-barres (facultatif).</p><textarea id="bl" rows="5" placeholder="Sucre 1 kg, 600, 750, 20&#10;Huile 1 L, 1200, 1400, 12&#10;Riz 5 kg, 2500, 2900, 8" aria-label="Liste de produits"></textarea><button onclick="bulkAdd()">Ajouter la liste</button></div>'+
  '<div class="card"><b>Mes produits ('+S.prods.length+')</b><label for="sf">Chercher un produit</label><input id="sf" type="search" oninput="filt()" placeholder="Ex : sucre">'+(S.prods.length?S.prods.map(function(p,i){return '<div class="row" data-n="'+esc((p.n+" "+(p.b||"")).toLowerCase())+'"><div><b>'+esc(p.n)+'</b><span class="lbl">Marge '+f(p.pv-p.pa)+' par unité'+(p.b?" · "+esc(p.b):"")+'</span></div><div class="pay"><span class="'+(p.q<=5?"low":"")+'">'+p.q+'</span><input id="rq'+i+'" type="number" inputmode="numeric" placeholder="+ stock" aria-label="Ajouter au stock"><button class="sm" onclick="restock('+i+')">Ajouter</button><button class="sm alt" onclick="delProd('+i+')" aria-label="Supprimer">X</button></div></div>'}).join(""):'<div class="empty">Aucun produit. Ajoute le premier ci-dessus.</div>')+'</div>'}
 if(tab=="dette"){var ks=Object.keys(S.debts);h+='<div class="card"><b>Clients qui te doivent de l\'argent</b>'+(ks.length?ks.map(function(c){var id=c.replace(/\W/g,"_");return '<div class="row"><div><b>'+esc(c)+'</b><span class="debt">'+f(S.debts[c])+'</span></div><div class="pay"><input id="d_'+id+'" type="number" inputmode="numeric" placeholder="Tout" aria-label="Montant reçu"><button class="sm" onclick="pay(\''+c.replace(/'/g,"\\'")+'\')">Encaisser</button><button class="sm alt" onclick="relance(\''+c.replace(/'/g,"\\'")+'\')">WhatsApp</button></div></div>'}).join(""):'<div class="empty">Personne ne te doit rien. Les ventes à crédit apparaissent ici.</div>')+'</div>'}

 if(tab=="hist"){var r=hdata(),op=[["1","Aujourd'hui"],["7","7 derniers jours"],["30","30 derniers jours"],["all","Tout l'historique"]];
  h+='<div class="card"><label for="hp">Période</label><select id="hp" onchange="HP=this.value;draw()">'+op.map(function(o){return '<option value="'+o[0]+'"'+(o[0]==HP?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></div>'+
   '<div class="grid"><div class="card"><div class="lbl">Ventes</div><div class="big">'+f(r.ca)+'</div></div><div class="card"><div class="lbl">Bénéfice</div><div class="big ok">'+f(r.mg)+'</div></div></div>'+
   '<div class="lbl" style="margin:0 2px 10px">'+r.n+' article(s) vendu(s) sur cette période</div>';
  if(!r.order.length)h+='<div class="card"><div class="empty">Aucune vente sur cette période.</div></div>';
  r.order.forEach(function(k){var d=r.days[k];
   h+='<div class="card"><div class="row"><div><b style="text-transform:capitalize">'+dlab(d.t)+'</b><span class="lbl">Bénéfice '+f(d.mg)+'</span></div><b>'+f(d.ca)+'</b></div>'+
    d.l.slice().reverse().map(function(s){return '<div class="row"><span>'+s.q+" × "+esc(s.n)+'<br><span class="lbl">'+hlab(s.t)+" · "+esc(s.m)+(s.c?" · "+esc(s.c):"")+'</span></span><span>'+f(s.pv*s.q)+'</span></div>'}).join("")+'</div>'});
  if(r.n)h+='<button class="acc" onclick="hwa()">Envoyer le rapport sur WhatsApp</button>'}
 document.getElementById("app").innerHTML=h}
load();draw();
try{if("serviceWorker" in navigator&&location.protocol=="https:")navigator.serviceWorker.register("sw.js")}catch(e){}
var ip=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();ip=e;var b=document.createElement("button");b.textContent="Installer l'application";b.className="acc";b.style.cssText="position:fixed;left:16px;right:16px;bottom:76px;z-index:5;width:auto";b.onclick=function(){ip.prompt();b.remove()};document.body.appendChild(b)});
</script>
</body>
</html>
